volumes:
    backend-data:
    runtime-data:
    static-data:
    dashboard-db-data:

networks:
    public:
    private:

services:
    backend:
        image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPOSITORY:-local}/backend:${IMAGE_TAG:-latest}
        build:
            context: ./backend
        volumes:
            - backend-data:/volume_data
        env_file:
            - .env
        networks:
            - private
            - public
        restart: always
        command:
            - poetry
            - run
            - gunicorn
            - kernelCI.wsgi:application
            - --workers=5
            - --forwarded-allow-ips=*
            - --bind=0.0.0.0:8000
            - --timeout=250
        entrypoint: "./utils/docker/backend_entrypoint.sh"
        depends_on:
            - redis
            - database

    ingester:
        image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPOSITORY:-local}/backend:${IMAGE_TAG:-latest}
        volumes:
            - backend-data:/volume_data # Directory of the tree names file and other data
            - ${INGESTER_SPOOL_DIR:-./spool}:/app/spool                 # Directory for ingester to monitor
        env_file:
            - .env
        networks:
            - private
        command:
            - poetry
            - run
            - python3
            - manage.py
            - monitor_submissions
            - --spool-dir
            - /app/spool
        restart: always
        depends_on:
            - database
        profiles: ["with_commands"]

    pending_aggregations_processor:
        image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPOSITORY:-local}/backend:${IMAGE_TAG:-latest}
        env_file:
            - .env
        networks:
            - private
        command:
            - poetry
            - run
            - python3
            - manage.py
            - process_pending_aggregations
            - --loop
            - --interval
            - "5"
        restart: always
        depends_on:
            - database
        profiles: ["with_commands"]

    database:
        image: postgres:17
        env_file:
            - .env
        volumes:
            - dashboard-db-data:/var/lib/postgresql/data
        networks:
            - private

    redis:
        image: redis:8.0-M04-alpine
        restart: always
        networks:
            - private

    frontend:
        image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPOSITORY:-local}/frontend:${IMAGE_TAG:-latest}
        build:
            context: ./dashboard
        volumes:
            - static-data:/data/static

    anubis:
        image: ${ANUBIS_IMAGE:-ghcr.io/techarohq/anubis:v1.25.0}
        restart: always
        networks:
            - public
        environment:
            BIND: ":8923"
            METRICS_BIND: ":9090"
            TARGET: "http://proxy:8080"
            POLICY_FNAME: "/data/cfg/botPolicy.yaml"
            COOKIE_SECURE: ${ANUBIS_COOKIE_SECURE:-false}
        volumes:
            - ./anubis/botPolicy.yaml:/data/cfg/botPolicy.yaml:ro
        healthcheck:
            test: ["CMD", "anubis", "--healthcheck"]
            interval: 30s
            timeout: 3s
            retries: 3
            start_period: 30s
            start_interval: 500ms

    proxy:
        image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPOSITORY:-local}/proxy:${IMAGE_TAG:-latest}
        build: ./proxy
        restart: always
        depends_on:
            backend:
                condition: service_started
            frontend:
                condition: service_completed_successfully
            anubis:
                condition: service_healthy
        networks:
            - public
        volumes:
            - static-data:/data/static
            - /etc/letsencrypt/live/staging.dashboard.kernelci.org/fullchain.pem:/etc/nginx/ssl/fullchain.pem
            - /etc/letsencrypt/live/staging.dashboard.kernelci.org/privkey.pem:/etc/nginx/ssl/privkey.pem
        env_file:
            - .env
